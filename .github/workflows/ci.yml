name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'

      - name: Build
        run: |
          dotnet build src/SecretsManager.App -c Release -p:Platform=x64
          dotnet build src/SecretsManager.Cli -c Release

      # SecretsServiceTests drive the real SecretManagement module against tests/TestVault (never SecretStore).
      - name: Install SecretManagement
        shell: pwsh
        run: Install-PSResource Microsoft.PowerShell.SecretManagement -Scope CurrentUser -TrustRepository

      # Unit and integration tests. The UI test (tests/Invoke-AppUiTest.ps1) and the explicit real-SecretStore
      # tests need a desktop session and a real store, so they run locally only.
      - name: Test
        run: dotnet test --project tests/SecretsManager.Core.Tests -c Release

      # The shipping build: compressed self-contained app (PowerShell modules placed before bundling) + NativeAOT CLI.
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/SecretsManager.App -c Release -p:Platform=x64 -r win-x64 --self-contained -p:PublishSingleFile=true -p:DebugType=embedded -o publish
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish src/SecretsManager.Cli -c Release -r win-x64 -o publish
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $files = Get-ChildItem publish -File
          $files | Format-Table Name, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } } | Out-String | Write-Host
          if (($files.Name | Sort-Object) -join ',' -ne 'SecretsManager.Cli.exe,SecretsManager.exe') { throw "unexpected publish output: $($files.Name -join ', ')" }

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: SecretsManager-win-x64
          path: publish/*.exe
          if-no-files-found: error
