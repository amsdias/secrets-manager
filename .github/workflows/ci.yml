name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'

      # A tag v1.2.3 builds version 1.2.3; other builds are 0.0.<run number>.
      - name: Version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.0.$env:GITHUB_RUN_NUMBER" }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tags must look like v1.2.3 (got '$env:GITHUB_REF_NAME')" }
          "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Version $version"

      - name: Build
        run: |
          dotnet build src/SecretsManager.App -c Release -p:Platform=x64
          dotnet build src/SecretsManager.Cli -c Release

      # SecretsServiceTests drive the real SecretManagement module against tests/TestVault (never SecretStore). Nothing is
      # installed here on purpose: the tests use the copies bundled in third_party, as the app does on a clean PC.
      - name: Test
        run: dotnet test --project tests/SecretsManager.Core.Tests -c Release

      # The shipping build: compressed self-contained app (PowerShell modules placed before bundling) + NativeAOT CLI.
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/SecretsManager.App -c Release -p:Platform=x64 -r win-x64 --self-contained -p:PublishSingleFile=true -p:DebugType=embedded -p:Version=$env:VERSION -o publish
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish src/SecretsManager.Cli -c Release -r win-x64 -p:Version=$env:VERSION -o publish
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $files = Get-ChildItem publish -File
          $files | Format-Table Name, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } } | Out-String | Write-Host
          if (($files.Name | Sort-Object) -join ',' -ne 'secrets.exe,SecretsManager.exe') { throw "unexpected publish output: $($files.Name -join ', ')" }

      - name: Installer (MSI)
        shell: pwsh
        run: |
          dotnet build installer/SecretsManager.Installer.wixproj -c Release -p:Version=$env:VERSION -p:PublishDir="$PWD\publish\"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item installer/bin/Release/PowerShellSecrets.msi "dist/PowerShellSecrets-$env:VERSION-x64.msi"
          Copy-Item publish/*.exe dist/

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: PowerShellSecrets-win-x64
          path: dist/*
          if-no-files-found: error

  # Tags only: a GitHub Release with the MSI and the two exes. The only job that may write to the repository.
  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: PowerShellSecrets-win-x64
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "PowerShell Secrets $GITHUB_REF_NAME" --generate-notes
